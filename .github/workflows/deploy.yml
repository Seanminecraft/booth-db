# 部署到 GitHub Pages。設定（不是密鑰，但集中管理）放在 repository variables：
#   Settings → Secrets and variables → Actions → Variables：API_URL、OAUTH_CLIENT_ID、CONTACT
# Settings → Pages → Source 選「GitHub Actions」。
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每小時重新產生公開資料快照（data/index.json 等），網站第一次載入不用等 Apps Script。
  # 這是 GitHub 的排程，不是 Apps Script 觸發器。repo 60 天沒有活動時 GitHub 會自動暫停排程，屆時在 Actions 頁按「Enable workflow」即可。
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node -e "new (require('vm').Script)(require('fs').readFileSync('apps-script/code.gs','utf8'),{filename:'code.gs'})"
          for f in site/assets/*.js; do node --check "$f"; done
          node tests/run-frontend-tests.js
      - name: Write config.js from repository variables
        env:
          API_URL: ${{ vars.API_URL }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          CONTACT: ${{ vars.CONTACT }}
        run: |
          test -n "$API_URL" || { echo "::error::repository variable API_URL is not set"; exit 1; }
          test -n "$OAUTH_CLIENT_ID" || { echo "::error::repository variable OAUTH_CLIENT_ID is not set"; exit 1; }
          node -e "
            const c={API_URL:process.env.API_URL,OAUTH_CLIENT_ID:process.env.OAUTH_CLIENT_ID,SITE_NAME:'攤位資料庫',CONTACT:process.env.CONTACT||'',DEV_LOGIN:false};
            require('fs').writeFileSync('site/assets/config.js','window.BOOTH_CONFIG='+JSON.stringify(c)+';\n');"
      - name: Snapshot public data from Apps Script (index / meta / relations overlay)
        env:
          API_URL: ${{ vars.API_URL }}
        run: node tools/snapshot.js site/data
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
